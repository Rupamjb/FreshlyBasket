<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // This is a SPA fallback page for direct access to routes on Vercel
      // Will redirect to the homepage while preserving the route/path
      const path = window.location.pathname;
      window.location.href = `/?path=${encodeURIComponent(path)}`;
    </script>
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="/">link</a> to the homepage.</p>
  </body>
</html>
