<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Handle SPA routing - redirect to the main app
    const segment = window.location.pathname;
    window.location.href = `/${segment.indexOf('/') === 0 ? segment.slice(1) : segment}`;
  </script>
</head>
<body>
  <p>Redirecting to the application...</p>
</body>
</html>
